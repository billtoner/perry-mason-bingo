name: CI & Deploy

# Tests and lint run on every PR and on pushes to main. The deploy job runs only after
# the tests pass, so a failing lint can no longer reach players.
#
# ACTIVATION (one-time, in repo Settings → Pages): set "Source" to "GitHub Actions".
# Until then this deploy job will not take over from the legacy "deploy from a branch"
# build; the site keeps publishing the old way and the deploy job simply won't apply.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Unit tests
        run: node --test
      - name: Lint squares.txt
        run: node scripts/lint-squares.js

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only the site files
        run: |
          mkdir -p _site
          cp index.html bingo.js squares.txt CNAME _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
