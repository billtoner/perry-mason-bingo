name: CI & Deploy

# Tests and lint run on every PR and on pushes to main. The deploy job runs only after
# the tests pass, so a failing lint can no longer reach players.
#
# Pages "Source" is set to "GitHub Actions", so this deploy job is what publishes the site
# (only the four files staged below). If Pages is ever reset to "deploy from a branch",
# re-set Source to "GitHub Actions" in Settings → Pages to re-activate this job.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - name: Unit tests
        run: node --test
      - name: Lint squares.txt
        run: node scripts/lint-squares.js

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stage only the site files
        run: |
          mkdir -p _site
          cp index.html bingo.js squares.txt CNAME _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
